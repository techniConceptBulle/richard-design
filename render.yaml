services:
  - type: web
    name: richard-design
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # Pretty URLs .html générées au build (fichiers réels).
    # Rewrites optionnels pour les URLs sans .html.
    routes:
      - type: rewrite
        source: /categorie
        destination: /pages/category.html
      - type: rewrite
        source: /categorie/*
        destination: /pages/category.html
      - type: rewrite
        source: /produit
        destination: /pages/product.html
      - type: rewrite
        source: /produit/*
        destination: /pages/product.html
      - type: rewrite
        source: /marque
        destination: /pages/brand.html
      - type: rewrite
        source: /marque/*
        destination: /pages/brand.html
