services:
  - type: web
    name: richard-design
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # Les pages /categorie/{slug}.html sont générées au build (fichiers réels).
    # Rewrite optionnel pour les URLs sans .html.
    routes:
      - type: rewrite
        source: /categorie
        destination: /pages/category.html
      - type: rewrite
        source: /categorie/*
        destination: /pages/category.html
